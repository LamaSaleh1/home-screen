<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Thmanyah fonts: the licence forbids hosting the font files on a public site, so they are NOT in this repo.
   If the files exist on the device (the TV app serves them locally) they are used, otherwise Amiri / Noto Naskh are used. */
@font-face { font-family: "Thmanyah Serif Display"; font-weight: 700; src: url("fonts/thmanyah-serif-display-700.otf"); font-display: swap; }
@font-face { font-family: "Thmanyah Serif Display"; font-weight: 400; src: url("fonts/thmanyah-serif-display-400.otf"); font-display: swap; }
@font-face { font-family: "Thmanyah Serif Text"; font-weight: 400; src: url("fonts/thmanyah-serif-text-400.otf"); font-display: swap; }
@font-face { font-family: "Thmanyah Serif Text"; font-weight: 700; src: url("fonts/thmanyah-serif-text-700.otf"); font-display: swap; }

:root {
  --bg: #08130f;
  --fg: #f4efe3;
  --mute: rgba(244, 239, 227, 0.7);
  --faint: rgba(244, 239, 227, 0.22);
  --accent: #e3c27a;
  --font-display: "Thmanyah Serif Display", "Amiri", "Noto Naskh Arabic", serif;
  --font-text: "Thmanyah Serif Text", "Noto Naskh Arabic", "Amiri", serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-text);
  overflow: hidden;
  direction: rtl;
  padding-inline: 4.2vw;
  box-sizing: border-box;
}
.bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -3; }
.hasphoto .bg { display: none; }
.bg .tw { animation: twinkle 6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: 0.15; } }
.photo {
  position: fixed; inset: 0; z-index: -2;
  background: center / cover no-repeat;
  filter: brightness(0.62) saturate(0.85);
  opacity: 0; transition: opacity 3s ease;
}
.photo.on { opacity: 1; }
.shade {
  position: fixed; inset: 0; z-index: -1;
  background:
    linear-gradient(180deg, rgba(3, 9, 7, 0.4) 0%, rgba(3, 9, 7, 0.12) 22%, rgba(3, 9, 7, 0.12) 52%, rgba(3, 9, 7, 0.72) 80%, rgba(3, 9, 7, 0.88) 100%),
    radial-gradient(ellipse at 78% 52%, rgba(3, 9, 7, 0.38), rgba(3, 9, 7, 0) 55%);
}

.stage {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  padding-block: 4vmin 4vmin;
  box-sizing: border-box;
  transition: transform 60s linear;
  text-shadow: 0 0.2vmin 1.4vmin rgba(0, 0, 0, 0.6), 0 0 0.4vmin rgba(0, 0, 0, 0.35);
}

/* top: date on the start side, small weather on the other */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4vmin; }
.dow { font-family: var(--font-display); font-weight: 700; font-size: 6vmin; line-height: 1.2; }
.hijri { font-size: 3.3vmin; font-weight: 500; margin-top: 0.4vmin; }
.greg { font-size: 3vmin; color: var(--mute); margin-top: 0.2vmin; }
.place { font-size: 2.3vmin; color: var(--accent); margin-top: 0.8vmin; letter-spacing: 0.02em; }

.wx { display: flex; align-items: center; gap: 1.6vmin; text-align: start; padding-top: 0.6vmin; }
.wx .now { font-family: var(--font-display); font-weight: 700; font-size: 5.4vmin; line-height: 1; direction: ltr; }
.wx .cond { font-size: 2.2vmin; color: var(--mute); line-height: 1.3; }
.wx .hl { font-size: 2vmin; color: var(--mute); direction: rtl; line-height: 1.3; }
.ico { width: 4.2vmin; height: 4.2vmin; stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* the big clock */
.clock { align-self: center; min-height: 0; text-align: start; }
.time {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34vmin;
  line-height: 1.05;
  direction: ltr;
  display: flex;
  justify-content: flex-end;
  align-items: baseline;
  white-space: nowrap;
}
.time > span { unicode-bidi: isolate; }
.time { margin-right: -0.17em; }
.time .colon { position: relative; top: -0.04em; }
.time .ampm { order: -1; font-size: 0.14em; font-weight: 700; margin-inline-end: 0.3em; color: var(--mute); }
@keyframes blink { 50% { opacity: 0.3; } }

/* bottom: three quiet columns */
.bottom {
  display: grid;
  grid-template-columns: 1fr 1.55fr 0.8fr;
  align-items: stretch;
  border-top: 1px solid var(--faint);
  padding-top: 2.4vmin;
  height: 33vmin;            /* fixed, so the divider never moves with the number of matches */
  box-sizing: border-box;
  min-height: 0;
}
.col { min-width: 0; padding-inline: 3vmin; border-inline-start: 1px solid var(--faint); }
.col:first-child { padding-inline-start: 0; border-inline-start: 0; }
.col:last-child { padding-inline-end: 0; }
.k { font-size: 2.1vmin; color: var(--mute); margin-bottom: 0.8vmin; }

.nxt .nm { font-family: var(--font-display); font-weight: 700; font-size: 6vmin; line-height: 1.15; }
.nxt .nm small { font-family: var(--font-text); font-weight: 500; font-size: 0.42em; color: var(--mute); margin-inline-start: 1.2vmin; }
.nxt .cd { font-family: var(--font-display); font-weight: 700; font-size: 8.2vmin; line-height: 1.1; color: var(--accent); direction: ltr; text-align: right; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 0.8vmin 1.4vmin; margin-top: 1vmin; min-height: 3vmin; font-size: 2.1vmin; color: var(--mute); }
.tags span::before { content: "• "; color: var(--accent); }

.mt { display: flex; flex-direction: column; gap: 1vmin; }
#matches { display: flex; flex-direction: column; gap: 1.1vmin; }
.mt .m .tm { font-family: var(--font-display); font-weight: 700; font-size: 3.1vmin; line-height: 1.2; }
.mt .m .tm i { font-style: normal; color: var(--mute); font-weight: 400; padding-inline: 0.6vmin; }
.mt .m .sb { font-size: 1.9vmin; color: var(--mute); line-height: 1.3; }
.mt .m .sb b { color: var(--accent); font-weight: 600; }
.mt .none { font-size: 2.6vmin; color: var(--mute); }
.mt .more { font-size: 2vmin; color: var(--mute); }

.pr .row { display: flex; justify-content: space-between; gap: 2vmin; font-size: 2.4vmin; line-height: 1.5; color: var(--mute); }
.pr .row.next { color: var(--accent); font-weight: 700; }
.pr .row .t { font-family: var(--font-display); font-weight: 700; direction: ltr; }

@media (max-aspect-ratio: 1/1) {
  .stage { overflow-y: auto; }
  .bottom { grid-template-columns: 1fr; row-gap: 4vmin; }
  .col { border: 0; padding-inline: 0; }
  .time { font-size: 30vmin; text-align: center; }
  body { overflow-y: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .time .colon, .bg .tw { animation: none; }
  .stage { transition: none; }
}
</style>
</head>

<script>
// PURE-START
var TZ = "Asia/Riyadh", LAT = 25.8694, LNG = 43.4973, TZH = 3;
var R = Math.PI / 180;
function sin(a) { return Math.sin(a * R); }
function cos(a) { return Math.cos(a * R); }
function tan(a) { return Math.tan(a * R); }
function acos(x) { return Math.acos(Math.max(-1, Math.min(1, x))) / R; }
function asin(x) { return Math.asin(x) / R; }
function atan(x) { return Math.atan(x) / R; }

function sunFor(y, m, d) {
  var n = (Date.UTC(y, m - 1, d, 12) - Date.UTC(2000, 0, 1, 12)) / 864e5;
  var g = 357.529 + 0.98560028 * n;
  var q = 280.459 + 0.98564736 * n;
  var L = q + 1.915 * sin(g) + 0.02 * sin(2 * g);
  var e = 23.439 - 3.6e-7 * n;
  var RA = Math.atan2(cos(e) * sin(L), cos(L)) / R / 15;
  RA = ((RA % 24) + 24) % 24;
  var eq = (q / 15 - RA) % 24;
  if (eq < -12) eq += 24;
  if (eq > 12) eq -= 24;
  return { D: asin(sin(e) * sin(L)), eq: eq };
}
// Umm al-Qura: Fajr 18.5 deg, Isha 90 min after Maghrib (120 in Ramadan), Asr shadow ratio 1.
function prayerTimes(y, m, d, ramadan) {
  var s = sunFor(y, m, d);
  function T(alt) { return acos((sin(alt) - sin(s.D) * sin(LAT)) / (cos(s.D) * cos(LAT))) / 15; }
  var noon = 12 + TZH - LNG / 15 - s.eq;
  var asrAlt = atan(1 / (1 + tan(Math.abs(LAT - s.D))));
  var maghrib = noon + T(-0.833);
  return {
    fajr: noon - T(-18.5),
    sunrise: noon - T(-0.833),
    dhuhr: noon + 1 / 60,
    asr: noon + T(asrAlt),
    maghrib: maghrib,
    isha: maghrib + (ramadan ? 2 : 1.5)
  };
}
// PURE-END

var NAMES = [["fajr", "الفجر"], ["sunrise", "الشروق"], ["dhuhr", "الظهر"], ["asr", "العصر"], ["maghrib", "المغرب"], ["isha", "العشاء"]];

// ---- helpers: Arabic-Indic digits everywhere ----
function H(s) { return String(s).replace(/[0-9]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".charAt(+d); }); }
function parts(date) {
  var o = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" })
    .formatToParts(date).forEach(function (p) { if (p.type !== "literal") o[p.type] = +p.value; });
  return o;
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function fmt(h) {
  var t = Math.round((((h % 24) + 24) % 24) * 60) % 1440;
  var hh = Math.floor(t / 60), mm = t % 60;
  return H(((hh % 12) || 12) + ":" + pad(mm)) + " " + (hh < 12 ? "ص" : "م");
}
function fmtDate(d) {
  var p = parts(d);
  return H(((p.hour % 12) || 12) + ":" + pad(p.minute)) + " " + (p.hour < 12 ? "ص" : "م");
}
function hijriMonth(date) {
  var m = 0;
  new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { timeZone: TZ, month: "numeric" })
    .formatToParts(date).forEach(function (p) { if (p.type === "month") m = +p.value; });
  return m;
}
var dowFmt = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { timeZone: TZ, weekday: "long" });
var hijriFmt = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn", { timeZone: TZ, day: "numeric", month: "long", year: "numeric" });
var gregFmt = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { timeZone: TZ, day: "numeric", month: "long", year: "numeric" });
var gregShort = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });

var els = {};
["hh", "mm", "ampm", "dow", "hijri", "greg", "rows", "tags", "nxname", "nxtime", "cdv", "matches"].forEach(function (id) { els[id] = document.getElementById(id); });
var lastKey = "", lastRowsSig = "", lastTagsSig = "", inRam = false, lastMinute = -1, lastPage = -1;
function setText(el, t) { if (el.textContent !== t) el.textContent = t; }

function render() {
  var now = new Date();
  var p = parts(now);
  var key = p.year + "-" + p.month + "-" + p.day;
  var hourNow = p.hour + p.minute / 60 + p.second / 3600;
  setText(els.hh, H(p.hour % 12 || 12));
  setText(els.ampm, p.hour < 12 ? "ص" : "م");
  setText(els.mm, H(pad(p.minute)));

  if (key !== lastKey) {
    var hj = hijriFmt.format(now);
    setText(els.dow, dowFmt.format(now));
    setText(els.hijri, H(hj.replace(/\s*هـ?\s*$/, "")) + " هـ");
    setText(els.greg, H(gregFmt.format(now).replace(/\s*م\s*$/, "")) + " م");
    inRam = hijriMonth(now) === 9;
    lastKey = key;
    lastMinute = -1;
  }

  var today = prayerTimes(p.year, p.month, p.day, inRam);
  var tp = parts(new Date(now.getTime() + 864e5));
  var tomorrow = prayerTimes(tp.year, tp.month, tp.day, false);

  var nextKey = null, nextAt = 0;
  var order = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
  for (var i = 0; i < order.length; i++) {
    if (today[order[i]] > hourNow) { nextKey = order[i]; nextAt = today[order[i]]; break; }
  }
  if (!nextKey) { nextKey = "fajr"; nextAt = tomorrow.fajr + 24; }

  var sig = key + nextKey;
  if (sig !== lastRowsSig) {
    els.rows.innerHTML = NAMES.map(function (n) {
      return '<div class="row' + (n[0] === nextKey ? " next" : "") + '"><span>' + n[1] + '</span><span class="t">' + fmt(today[n[0]]) + "</span></div>";
    }).join("");
    lastRowsSig = sig;
  }

  var secs = Math.max(0, Math.round((nextAt - hourNow) * 3600));
  var nm = NAMES.filter(function (n) { return n[0] === nextKey; })[0][1];
  setText(els.nxname, nm);
  setText(els.nxtime, fmt(nextAt));

var PHOTO_EVERY = 2 * 60 * 1000;
function photoUrl(id) { if (id.indexOf("local:") === 0) return id.slice(6); var smart = id.indexOf("!") > 0; id = id.replace("!", ""); return "https://images.unsplash.com/" + id + "?fm=jpg&q=85&w=2400" + (smart ? "&h=1350&crop=entropy" : "&auto=format") + "&fit=crop"; }
var photoIdx = Math.floor(Date.now() / PHOTO_EVERY) % PHOTOS.length, photoFront = "A";
var photoClean;
function showPhoto(tries) {
  if (tries >= PHOTOS.length) return;
  var url = photoUrl(PHOTOS[photoIdx]);
  var img = new Image();
  img.onload = function () {
    var back = document.getElementById(photoFront === "A" ? "photoB" : "photoA");
    var front = document.getElementById(photoFront === "A" ? "photoA" : "photoB");

    back.style.transition = "none"; back.className = "photo"; back.style.zIndex = "-2";

    back.style.transition = ""; back.className = "photo on";

document.addEventListener("click", function () { nextPhoto(1); });
